name: Caffeinated
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Caffeinated:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Caffeinated
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauderbaugh.Caffeinated
        PRODUCT_NAME: Caffeinated
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
